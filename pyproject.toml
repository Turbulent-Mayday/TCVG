[project]
name = "tcvg"
version = "0.1.0"
description = "High-speed CV pipeline for real-time trading card recognition"
readme = "README.md"
authors = [
    { name = "Turbulent-Mayday" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[dependency-groups]
backend = [
    "fastapi>=0.148.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]
cv = [
    "onnxruntime>=1.31.0",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.182",
]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.0",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "streamlit>=1.67.0",
    "vulture>=2.16",
]
recognition = [
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "libsql-client>=0.3.1",
]

[tool.mypy]
files = [
    "src/database",
    "src/sql",
    "tests",
]
strict = false
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "libsql_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
