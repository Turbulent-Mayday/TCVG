name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: write

env:
  FORCE_COLOR: "1"
  TERM: "xterm-256color"

jobs:
  lint-and-audit:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and setup Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff Linter & Formatter Check
        run: |
          uv run ruff check src/database src/sql tests
          uv run ruff format --check src/database src/sql tests

      - name: Mypy Type Checking
        run: uv run mypy

      - name: Vulture Dead Code Scan
        run: uv run vulture src/database src/sql tests --min-confidence 80

      - name: Bandit Security Audit
        run: uv run bandit -r src/database src/sql -ll

  test-matrix:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-and-audit
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and setup Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Pytest with Visual Output & Coverage
        run: |
          uv run pytest -s -v --color=yes \
            --cov=src/database --cov=src/sql \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Update README coverage badge
        if: matrix.python-version == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -c "
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse('coverage.xml').getroot()
          pct = round(float(root.attrib['line-rate']) * 100)

          if pct >= 90:
              color = 'brightgreen'
          elif pct >= 80:
              color = 'green'
          elif pct >= 70:
              color = 'yellow'
          elif pct >= 60:
              color = 'orange'
          else:
              color = 'red'

          badge_url = f'https://img.shields.io/badge/coverage-{pct}%25-{color}'

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          updated = re.sub(
              r'https://img\.shields\.io/badge/coverage-\d+%25-[a-z]+',
              badge_url,
              content
          )

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated)
          print(f'Updated coverage badge to: {pct}% ({color})')
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: update coverage badge [skip ci]"
            git push
          fi

      - name: Upload Coverage Artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml